name: Complete Delivered Orders

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  complete-delivered-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Complete orders delivered for 14 days
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://bright-ark-dental-lab-form.vercel.app/api/cron/complete-delivered-orders"
