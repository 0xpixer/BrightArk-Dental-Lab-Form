name: Lark Order Notifications

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  notify-lark:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Lark about newly submitted orders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://bright-ark-dental-lab-form.vercel.app/api/cron/lark-orders"
